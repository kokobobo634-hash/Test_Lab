{% extends "base.html" %}
{% block title %}관리자 패널 - VulnLab{% endblock %}
{% block content %}
<div class="card">
  <h2>🔑 관리자 패널</h2>
  <div class="vuln-info">
    <b>[취약점 6] 권한 상승 성공!</b><br>
    <code>role</code> 쿠키를 <code>admin</code>으로 변조하여 접근 성공
  </div>

  <h3>전체 사용자 목록</h3>
  <table class="data-table">
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u['id'] }}</td>
        <td>{{ u['username'] }}</td>
        <td>{{ u['email'] }}</td>
        <td><span class="badge {% if u['role'] == 'admin' %}badge-admin{% else %}badge-user{% endif %}">{{ u['role'] }}</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
