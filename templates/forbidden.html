{% extends "base.html" %}
{% block title %}접근 거부 - VulnLab{% endblock %}
{% block content %}
<div class="card center-card">
  <h2>🚫 접근 거부 (403)</h2>
  <p>현재 역할: <span class="badge badge-user">{{ role }}</span></p>

  <div class="hint-box" id="hint-cookie">
    <button class="hint-btn" onclick="useHint('cookie')">💡 힌트</button>
    <div class="hint-content hidden" id="hint-content-cookie">
      <p><b>기본 페이로드:</b> <code>role=user</code></p>
      <p class="hint-note">이 페이로드는 그대로 동작하지 않습니다. 필터를 분석하고 우회 방법을 찾아보세요.</p>
    </div>
  </div>

  <a href="/dashboard" class="btn btn-secondary">← 대시보드로</a>
</div>
{% endblock %}
