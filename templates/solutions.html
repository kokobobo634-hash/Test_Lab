{% extends "base.html" %}
{% block title %}힌트 사용유무 - VulnLab{% endblock %}
{% block content %}
<div class="card">
  <h2>💡 힌트 사용유무</h2>
  <p class="muted" style="margin-bottom:1.5rem">각 챌린지에서 힌트 버튼을 클릭했는지 여부를 표시합니다. 힌트 사용 기록은 이 브라우저에만 저장됩니다.</p>

  <div class="hint-status-grid" id="hintStatusGrid"></div>

  <div style="margin-top:1.5rem; text-align:right">
    <button class="btn btn-secondary" onclick="resetHints()" style="font-size:0.85rem">기록 초기화</button>
  </div>
</div>

<script>
const CHALLENGES = [
  { key: 'sqli',      label: 'SQL Injection',    page: '/search'   },
  { key: 'cmdi',      label: 'Command Injection', page: '/ping'     },
  { key: 'upload',    label: '파일 업로드',        page: '/upload'   },
  { key: 'traversal', label: 'Path Traversal',    page: '/download' },
  { key: 'idor',      label: 'IDOR',              page: '/mypage'   },
  { key: 'cookie',    label: '쿠키 권한 상승',     page: '/admin'    },
];

function renderStatus() {
  const used = JSON.parse(localStorage.getItem('hintUsed') || '{}');
  const grid = document.getElementById('hintStatusGrid');
  grid.innerHTML = CHALLENGES.map(c => {
    const isUsed = !!used[c.key];
    return `
      <div class="hint-status-item ${isUsed ? 'used' : 'not-used'}">
        <span class="status-dot">${isUsed ? '🟡' : '🟢'}</span>
        <span class="status-label">${c.label}</span>
        <span class="status-badge">${isUsed ? '힌트 사용' : '미사용'}</span>
        <a href="${c.page}" class="status-link">→ 이동</a>
      </div>`;
  }).join('');
}

function resetHints() {
  if (confirm('힌트 사용 기록을 초기화하시겠습니까?')) {
    localStorage.removeItem('hintUsed');
    renderStatus();
  }
}

renderStatus();
</script>

<style>
.hint-status-grid { display: flex; flex-direction: column; gap: 0.6rem; }
.hint-status-item {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #2d3748;
}
.hint-status-item.not-used { background: #1a2e1a; border-color: #2d5a2d; }
.hint-status-item.used     { background: #2e2a1a; border-color: #5a4a2d; }
.status-dot   { font-size: 1rem; }
.status-label { flex: 1; font-weight: 500; }
.status-badge { font-size: 0.78rem; padding: 0.15rem 0.6rem; border-radius: 12px; background: rgba(255,255,255,0.08); color: #94a3b8; }
.status-link  { font-size: 0.82rem; color: #60a5fa; text-decoration: none; padding: 0.2rem 0.5rem; }
.status-link:hover { text-decoration: underline; }
</style>
{% endblock %}
