{% extends "base.html" %}
{% block title %}Command Injection - VulnLab{% endblock %}
{% block content %}
<div class="card">
  <h2>Ping 테스트</h2>

  <div class="hint-box" id="hint-cmdi">
    <button class="hint-btn" onclick="useHint('cmdi')">💡 힌트</button>
    <div class="hint-content hidden" id="hint-content-cmdi">
      <p><b>기본 페이로드:</b> <code>127.0.0.1; id</code></p>
      <p class="hint-note">이 페이로드는 그대로 동작하지 않습니다. 필터를 분석하고 우회 방법을 찾아보세요.</p>
    </div>
  </div>

  <form method="POST" action="/ping">
    <div class="form-row">
      <input type="text" name="target" value="{{ target }}" placeholder="IP 또는 도메인 (예: 127.0.0.1)" style="flex:1">
      <button type="submit" class="btn btn-primary">Ping</button>
    </div>
  </form>

  {% if output %}
    <div class="terminal">{{ output }}</div>
  {% endif %}
</div>
{% endblock %}
